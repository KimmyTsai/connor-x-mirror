<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鏡眼 Mirror Eye｜城市反射鏡風險地圖</title>
<style>
  :root{
    --bg:#f7f6f3; --panel:#fff; --line:#e3e1da;
    --text:#26251f; --muted:#6f6d64;
    --healthy:#639922; --warn:#ef9f27; --fail:#e24b4a; --gap:#378add; --unknown:#9b978a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;color:var(--text);background:var(--bg)}
  #app{display:grid;grid-template-columns:360px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
  header{padding:20px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;font-weight:600}
  .sub{margin-top:4px;font-size:13px;color:var(--muted)}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:12px;text-align:center;font-size:14px;cursor:pointer;background:none;border:0;color:var(--muted)}
  .tab.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--text)}
  .stats{display:flex;gap:1px;background:var(--line)}
  .stat{flex:1;background:var(--panel);padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11px;color:var(--muted)}
  .item{padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:#faf9f6}
  .item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item .name{font-size:14px;font-weight:500}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
  .p-fail{background:var(--fail)} .p-warn{background:var(--warn)}
  .p-ok{background:var(--healthy)} .p-gap{background:var(--gap)}
  .p-unknown{background:var(--unknown)}
  .item .why{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}
  .bars{margin-top:8px;display:grid;gap:4px}
  .bar{display:grid;grid-template-columns:64px 1fr 28px;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
  .track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .fill{height:100%;background:var(--text)}
  #map{width:100%;height:100%}
  .legend{position:absolute;bottom:24px;right:16px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px}
  .legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
  .dot{width:9px;height:9px;border-radius:50%}
  .review{margin-top:6px;font-size:11px;color:var(--gap)}
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>鏡眼 Mirror Eye</h1>
      <div class="sub">城市反射鏡風險地圖</div>
    </header>
    <div class="tabs">
      <button class="tab on" data-view="mirrors">維護優先序</button>
      <button class="tab" data-view="review">待複查</button>
      <button class="tab" data-view="gaps">設置需求</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  </aside>
  <div style="position:relative">
    <div id="map"></div>
    <div class="legend" id="legend">
      <div data-for="mirrors"><span class="dot" style="background:var(--healthy)"></span>健康</div>
      <div data-for="mirrors"><span class="dot" style="background:var(--warn)"></span>需保養</div>
      <div data-for="mirrors"><span class="dot" style="background:var(--fail)"></span>失效</div>
      <div data-for="review"><span class="dot" style="background:var(--unknown)"></span>位置待確認，非鏡子清冊</div>
      <div data-for="gaps"><span class="dot" style="background:var(--gap)"></span>建議新設</div>
    </div>
  </div>
</div>

<script>
const API = window.API_BASE || "http://localhost:8080";
const MAPS_KEY = "YOUR_MAPS_API_KEY";
const COLORS = {"健康":"#639922","需保養":"#ef9f27","失效":"#e24b4a","位置待確認":"#9b978a","gap":"#378add"};
let map, infoWindow, geocoder, infoToken = 0, markers = [], view = "mirrors", cache = {};

function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {
    center:{lat:25.0250, lng:121.5635}, zoom:16, mapId:"DEMO_MAP_ID",
    disableDefaultUI:true, zoomControl:true
  });
  infoWindow = new google.maps.InfoWindow();
  load();
}

// image_uri 存進 BigQuery 時故意不帶金鑰，這裡渲染時才附加，避免金鑰進資料庫；
// size 也在這裡補上，涵蓋修 bug 之前寫入、沒有 size 參數的舊資料
function photoUrl(it){
  if(!it.image_uri) return null;
  const sep = it.image_uri.includes("size=") ? "" : "&size=640x640";
  return `${it.image_uri}${sep}&key=${MAPS_KEY}`;
}

function openInfo(it, marker){
  const token = ++infoToken;   // 非同步反查地址回來時，用這個確認彈窗還是同一個點
  const photo = photoUrl(it);
  let label, detail;
  if(view === "gaps"){
    label = `${(it.road_names||[]).join(" × ") || it.intersection_id}　${it.need_level} ${it.base_score}`;
    detail = `近三年 ${it.accident_count} 件事故　民眾回報 ${it.report_count} 次`;
  } else {
    label = it.mirror_present === false ? "位置待確認" : (it.condition_level ?? "");
    detail = it.reason ?? "";
  }
  const coords = `${it.lat.toFixed(6)}, ${it.lng.toFixed(6)}`;
  const mapsLink = `https://www.google.com/maps?q=${it.lat},${it.lng}`;
  const html = `<div style="max-width:220px;font-family:system-ui,'Noto Sans TC',sans-serif">
    ${photo ? `<img src="${photo}" style="width:100%;border-radius:6px;display:block;margin-bottom:6px" onerror="this.remove()">` : ""}
    <div style="font-weight:600;font-size:13px">${label}</div>
    <div style="font-size:12px;color:#6f6d64;margin-top:4px;line-height:1.4">${detail}</div>
    <div id="geo-addr" style="font-size:11px;color:#9b978a;margin-top:8px">查詢地址中…</div>
    <div style="font-size:11px;color:#6f6d64;margin-top:2px">${coords}</div>
    <a href="${mapsLink}" target="_blank" rel="noopener"
       style="display:inline-block;margin-top:4px;font-size:11px;color:#378add">在 Google 地圖開啟 ↗</a>
  </div>`;
  infoWindow.setContent(html);
  if(marker) infoWindow.open({map, anchor: marker});
  else { infoWindow.setPosition({lat: it.lat, lng: it.lng}); infoWindow.open(map); }

  geocoder = geocoder || new google.maps.Geocoder();
  geocoder.geocode({location: {lat: it.lat, lng: it.lng}}, (results, status)=>{
    if(token !== infoToken) return;   // 使用者已經切到別的點，這個結果過期了
    const el = document.getElementById("geo-addr");
    if(!el) return;
    if(status === "OK" && results[0]) el.textContent = results[0].formatted_address;
    else el.remove();
  });
}

function clearMarkers(){ markers.forEach(m=>m.setMap(null)); markers = []; }

const ENDPOINTS = {
  mirrors: "/api/mirrors?status=confirmed",
  review: "/api/mirrors?status=unconfirmed",
  gaps: "/api/gaps",
};

async function load(){
  const res = await fetch(`${API}${ENDPOINTS[view]}`);
  const data = await res.json();
  cache[view] = data.items;
  render(data.items);
}

function render(items){
  clearMarkers();
  const bounds = new google.maps.LatLngBounds();
  document.querySelectorAll("#legend > div").forEach(d=>{
    d.style.display = d.dataset.for === view ? "flex" : "none";
  });

  items.forEach(it=>{
    const color = view === "gaps" ? COLORS.gap : COLORS[it.condition_level];
    const pos = {lat: it.lat, lng: it.lng};
    const m = new google.maps.Marker({
      map, position: pos,
      icon:{ path: google.maps.SymbolPath.CIRCLE, scale: 7,
             fillColor: color, fillOpacity: it.mirror_present === false ? .5 : .9,
             strokeColor:"#fff", strokeWeight: 1.5 }
    });
    m.addListener("click", ()=>{ focus(it); openInfo(it, m); });
    markers.push(m);
    bounds.extend(pos);
  });
  if(items.length) map.fitBounds(bounds);
  renderList(items);
  renderStats(items);
}

function renderStats(items){
  const el = document.getElementById("stats");
  if(view === "mirrors"){
    const c = l => items.filter(i=>i.condition_level===l).length;
    el.innerHTML = `
      <div class="stat"><b>${items.length}</b><span>已確認鏡子</span></div>
      <div class="stat"><b style="color:var(--fail)">${c("失效")}</b><span>失效</span></div>
      <div class="stat"><b style="color:var(--warn)">${c("需保養")}</b><span>需保養</span></div>`;
  }else if(view === "review"){
    el.innerHTML = `
      <div class="stat"><b style="color:var(--unknown)">${items.length}</b><span>待複查點位</span></div>`;
  }else{
    const c = l => items.filter(i=>i.need_level===l).length;
    el.innerHTML = `
      <div class="stat"><b>${items.length}</b><span>缺口路口</span></div>
      <div class="stat"><b style="color:var(--fail)">${c("急迫")}</b><span>急迫</span></div>
      <div class="stat"><b>${items.filter(i=>i.flag_review).length}</b><span>待複查</span></div>`;
  }
}

function renderList(items){
  const el = document.getElementById("list");
  el.innerHTML = items.slice(0,60).map((it,i)=>{
    if(view === "mirrors"){
      const cls = {"失效":"p-fail","需保養":"p-warn","健康":"p-ok"}[it.condition_level];
      return `<div class="item" onclick="focusIdx(${i})">
        <div class="top">
          <span class="name">${it.mirror_id.slice(0,8)}</span>
          <span class="pill ${cls}">優先序 ${it.priority_score}</span>
        </div>
        <div class="why">${it.reason ?? ""}</div>
        ${it.needs_human_review ? '<div class="review">信心不足，已排入人工複查</div>' : ""}
      </div>`;
    }
    if(view === "review"){
      return `<div class="item" onclick="focusIdx(${i})">
        <div class="top">
          <span class="name">${it.mirror_id.slice(0,8)}</span>
          <span class="pill p-unknown">待複查</span>
        </div>
        <div class="why">${it.reason ?? ""}</div>
        <div class="review">Stage 2 特寫未能在登記座標重新確認鏡子——不是鏡子清冊的一部分，
          可能是座標估算誤差或 Stage 1 誤判，點圖看實際照片判斷</div>
      </div>`;
    }
    const names = (it.road_names||[]).join(" × ") || it.intersection_id;
    return `<div class="item" onclick="focusIdx(${i})">
      <div class="top">
        <span class="name">${names}</span>
        <span class="pill p-gap">${it.need_level} ${it.base_score}</span>
      </div>
      <div class="bars">
        ${bar("事故紀錄", it.s_accident, 40)}
        ${bar("轉角視距", it.s_sight, 25)}
        ${bar("道路寬度", it.s_width, 10)}
        ${bar("弱勢用路", it.s_vulnerable, 25)}
      </div>
      <div class="why">近三年 ${it.accident_count} 件事故　民眾回報 ${it.report_count} 次</div>
      ${it.flag_review ? '<div class="review">民意高於模型分數，建議人工複查</div>' : ""}
    </div>`;
  }).join("");
}

function bar(label, v, max){
  const pct = Math.round((v/max)*100);
  return `<div class="bar"><span>${label}</span>
    <span class="track"><span class="fill" style="width:${pct}%"></span></span>
    <span>${v}</span></div>`;
}

function focusIdx(i){
  const it = cache[view][i];
  focus(it);
  openInfo(it, markers[i]);
}
function focus(it){ map.panTo({lat:it.lat,lng:it.lng}); map.setZoom(19); }

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    view = t.dataset.view;
    load();
  };
});
</script>
<script async
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_MAPS_API_KEY&callback=initMap">
</script>
</body>
</html>
